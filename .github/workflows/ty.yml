name: ty

on: [push]

jobs:
  ty:
    name: ty type check
    runs-on: ubuntu-latest
    steps:
      - name: Check out Repo
        uses: actions/checkout@v4

      - name: Install uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies
        run: uv sync

      - name: Run ty check
        run: uv run ty check src/
